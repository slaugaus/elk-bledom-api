[package]
name = "elk-bledom-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["form"] }
axum-extra = { version = "0.12.6", features = ["query"] }
axum-template = { version = "3.0.0", features = ["handlebars"] }
bluer = "0.17.4"
handlebars = "6.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.10", features = ["fs"] }
yaml_serde = "0.10.4"
